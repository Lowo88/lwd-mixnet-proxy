name: audit

on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    paths: ["Cargo.lock", ".cargo/audit.toml"]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
