# Two containers, one per half. The dialling half needs an address the serving half only knows once
# it is running, so the order matters: start `server`, read the NYM_ADDRESS it prints, export it,
# start `client`. See README.md.
name: lwd-mixnet-proxy

services:
  server:
    build: .
    # Both services are the same image, tagged as `make image` tags it, so it is built once.
    image: lwd-mixnet-proxy:latest
    command: ["lwd-mixnet-server"]
    environment:
      # Defaults to the host, not this network: the usual deployment has the upstream already
      # running next to the daemon rather than as another service here.
      LWD_MIXNET_UPSTREAM: "${UPSTREAM:-host.docker.internal:9067}"
      LWD_MIXNET_STATE_DIR: "/state"
      LWD_MIXNET_METRICS_BIND: "0.0.0.0:9069"
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      # Holds the client identity, which is a private key directory: lose it and the address
      # changes, copy it and this half can be impersonated. An empty named volume inherits the
      # ownership of /state in the image, so the unprivileged uid can write to it. A volume left
      # over from an image that ran as root does not: see README.md.
      - server-state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only: the endpoint is unauthenticated.
      - "127.0.0.1:${SERVER_METRICS_PORT:-9069}:9069"
    # Registering with a gateway takes seconds and sometimes fails outright, so the grace period is
    # generous and a failure here means the half really is not serving.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9069/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  client:
    build: .
    image: lwd-mixnet-proxy:latest
    command: ["lwd-mixnet-client"]
    environment:
      # Left empty rather than made mandatory here, so `docker compose build` works before the
      # serving half has ever run and printed an address.
      LWD_MIXNET_SERVER: "${SERVER_ADDRESS:-}"
      LWD_MIXNET_BIND: "0.0.0.0:9068"
      LWD_MIXNET_METRICS_BIND: "0.0.0.0:9069"
      RUST_LOG: "${RUST_LOG:-info}"
    ports:
      # Bound to loopback on the host: this port is an unauthenticated door to the upstream.
      - "127.0.0.1:${CLIENT_HOST_PORT:-9068}:9068"
      - "127.0.0.1:${CLIENT_METRICS_PORT:-9070}:9069"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9069/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  server-state:
